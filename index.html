<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Travel Assistant</title>
    <!-- PWA settings -->
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap');
        
        * {
            box-sizing: border-box;
            font-family: 'Heebo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
            color: #0f172a;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 30px 20px 20px 20px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-titles h1 {
            margin: 0;
            font-size: 1.5em;
            font-weight: 800;
            color: #1e293b;
        }

        .header-titles p {
            margin: 5px 0 0 0;
            color: #64748b;
            font-size: 0.9em;
        }

        .profile-icon {
            width: 45px;
            height: 45px;
            background: #e0f2fe;
            color: #0284c7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
            padding-bottom: 50px;
        }

        .nav-btn {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.1s, box-shadow 0.1s;
            cursor: pointer;
        }

        .nav-btn:active {
            transform: scale(0.96);
            background: #f8fafc;
        }

        .nav-btn i {
            font-size: 2.2em;
            margin-bottom: 12px;
        }

        .nav-btn span {
            font-weight: 600;
            font-size: 0.95em;
            text-align: center;
        }

        /* Specific Colors */
        .color-emergency i { color: #ef4444; } /* Red */
        .color-food i { color: #f59e0b; } /* Orange */
        .color-hotels i { color: #3b82f6; } /* Blue */
        .color-alerts i { color: #eab308; } /* Yellow */
        .color-docs i { color: #10b981; } /* Green */
        .color-route i { color: #8b5cf6; } /* Purple */
        .color-map i { color: #ec4899; } /* Pink */
        .color-ai i { color: #0ea5e9; } /* Cyan */

        /* Under Construction Toast */
        #toast {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            transition: bottom 0.3s;
            z-index: 1000;
            white-space: nowrap;
        }
        
        .toast-visible {
            bottom: 30px !important;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-titles">
            <h1>סייען טיולים</h1>
            <p>הטיול שלך מתחיל כאן.</p>
        </div>
        <div class="profile-icon">
            <i class="fa-solid fa-user"></i>
        </div>
    </div>

    <div class="grid-container">
        <!-- Live Trip (Route) -->
        <div class="nav-btn color-route" onclick="showToast()">
            <i class="fa-solid fa-route"></i>
            <span>מסלול חי</span>
        </div>
        
        <!-- Emergency -->
        <div class="nav-btn color-emergency" onclick="showToast()">
            <i class="fa-solid fa-kit-medical"></i>
            <span>חירום רפואי</span>
        </div>

        <!-- Food -->
        <div class="nav-btn color-food" onclick="showToast()">
            <i class="fa-solid fa-utensils"></i>
            <span>מזון וכשרות</span>
        </div>

        <!-- Hotels -->
        <div class="nav-btn color-hotels" onclick="showToast()">
            <i class="fa-solid fa-bed"></i>
            <span>מלונות</span>
        </div>

        <!-- Alerts -->
        <div class="nav-btn color-alerts" onclick="showToast()">
            <i class="fa-solid fa-bell"></i>
            <span>התראות בלת"ם</span>
        </div>

        <!-- Documents -->
        <div class="nav-btn color-docs" onclick="showToast()">
            <i class="fa-solid fa-passport"></i>
            <span>מסמכים</span>
        </div>

        <!-- Map -->
        <div class="nav-btn color-map" onclick="showToast()">
            <i class="fa-solid fa-map-location-dot"></i>
            <span>מפה חיה</span>
        </div>

        <!-- AI Assistant -->
        <div class="nav-btn color-ai" onclick="showToast()">
            <i class="fa-solid fa-robot"></i>
            <span>סייען AI</span>
        </div>
    </div>

    <div id="toast">המסך בבנייה (שלב 2)</div>

    <script>
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('toast-visible');
            setTimeout(() => {
                toast.classList.remove('toast-visible');
            }, 3000);
        }
    </script>
</body>
</html>
